server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    # 业务文件上限 10MB；额外空间用于 multipart 边界和请求头。
    client_max_body_size 12m;

    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # VITE_BASE_URL=/api. The trailing slash on proxy_pass removes /api before
    # forwarding, so /api/health becomes FastAPI's /health route.
    location ^~ /api/ {
        proxy_pass http://api:9090/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 覆盖客户端自带头，API 只信任这一跳传入的真实来源地址。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Chat replies use SSE and must not be buffered by nginx.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|png|jpe?g|gif|svg|ico|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
